
name: Shyaway E2E Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Selenium E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify environment
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Run E2E tests
        run: >
          mvn --batch-mode --no-transfer-progress
          clean test
          -Dbrowser=chrome
          -Dheadless=true

      - name: Generate Allure report
        if: ${{ always() }}
        run: mvn --batch-mode --no-transfer-progress allure:report

      - name: Upload Allure report and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: shyaway-e2e-report
          path: |
            target/site/allure-maven-plugin/
            target/allure-results/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
